<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>틱톡 연결 코드</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e6e4df; --ok:#0f8a4f; --bad:#c43d3d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1f; --ink:#f1f0ee; --sub:#9a9a9f; --line:#2e2e30; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Noto Sans KR", system-ui, sans-serif; }
  .wrap { max-width:560px; margin:60px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--sub); margin:6px 0; }
  .code { margin:16px 0; padding:12px; border:1px dashed var(--line); border-radius:10px; font-family:ui-monospace,Consolas,monospace;
          font-size:13px; word-break:break-all; user-select:all; }
  button { height:42px; padding:0 18px; border:0; border-radius:10px; background:#1d1d1f; color:#fff; font:inherit; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { background:#f1f0ee; color:#141414; } }
  .msg { font-size:13px; margin-left:8px; color:var(--ok); }
  .bad { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="box"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code');          // URLSearchParams가 이미 디코딩해 줌
  const box = document.getElementById('box');
  if (code) {
    box.innerHTML = `<h1>틱톡 연결 코드</h1>
      <p>아래 코드를 복사해서, 열려 있는 검은 창(tiktok_login)에 붙여넣고 Enter를 누르세요.</p>
      <div class="code" id="c"></div>
      <button id="copy">코드 복사</button><span class="msg" id="m"></span>
      <p style="margin-top:14px">코드는 몇 분 안에 만료됩니다. 시간이 지났다면 tiktok_login.bat을 다시 실행하세요.</p>`;
    document.getElementById('c').textContent = code;
    document.getElementById('copy').onclick = async () => {
      try { await navigator.clipboard.writeText(code); document.getElementById('m').textContent = '복사했습니다'; }
      catch (e) { document.getElementById('m').textContent = '위 코드를 직접 드래그해서 복사해주세요'; }
    };
  } else {
    const err = q.get('error_description') || q.get('error');
    box.innerHTML = `<h1>${err ? '연결이 취소됐거나 실패했습니다' : '틱톡 연결 페이지'}</h1>
      <p class="${err ? 'bad' : ''}" id="e"></p>
      <p>tiktok_login.bat을 다시 실행해서 처음부터 진행해주세요.</p>`;
    document.getElementById('e').textContent = err || '이 페이지는 틱톡 로그인 후 연결 코드를 보여주는 용도입니다.';
  }
</script>
</body>
</html>
